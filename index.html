${S.subjects.map(s=>{const ts=S.tasks.filter(t=>t.sid==s.id),dn=ts.filter(t=>t.status=='completada').length,cl=S.classes.filter(c=>c.sid==s.id);
return`<div class=card><div class=row><span class=dot style="background:${col(s.id)};width:12px;height:12px"></span><h3 class=sp>${esc(s.name)}</h3><button class="btn2 sm" onclick="subForm('${s.id}')">Editar</button><button class="btn2 sm" onclick="subDel('${s.id}')">Eliminar</button></div>
<p class=mut style="margin:6px 0">${s.teacher?esc(s.teacher)+' · ':''}${s.credits?s.credits+' créditos · ':''}${ts.length-dn} pendientes · ${dn} completadas</p><div>${cl.map(c=>`<span class=tag>${DAYS[c.day].slice(0,3)} ${c.start}–${c.end}</span>`).join('')||'<span class=mut>Sin horarios.</span>'}</div>${s.notes?`<p style="margin:8px 0 0">${esc(s.notes)}</p>`:''}</div>`}).join('')||'<div class=card><span class=mut>No hay materias. Crea una o añade clases al horario.</span></div>'}`}
function subForm(id){const s=S.subjects.find(x=>x.id==id)||{};dlg(id?'Editar materia':'Nueva materia',`<label>Nombre<input name=name required value="${esc(s.name||'')}"></label><label>Profesor (opcional)<input name=teacher value="${esc(s.teacher||'')}"></label><label>Créditos (opcional)<input type=number name=cr min=0 max=20 value="${esc(s.credits||'')}"></label><label>Notas personales<textarea name=notes rows=3>${esc(s.notes||'')}</textarea></label>`,f=>{
const n=f.get('name').trim();if(!n)return false;if(S.subjects.some(x=>x.id!=id&&x.name.toLowerCase()==n.toLowerCase())){toast('Ya existe una materia con ese nombre');return false}
if(s.id)Object.assign(s,{name:n,teacher:f.get('teacher').trim(),credits:f.get('cr'),notes:f.get('notes')});else S.subjects.push({id:uid(),name:n,teacher:f.get('teacher').trim(),credits:f.get('cr'),notes:f.get('notes')});save();R();toast('Materia guardada')})}
const subDel=id=>ask('Se eliminará la materia junto con sus clases y tareas. ¿Continuar?',()=>{S.subjects=S.subjects.filter(x=>x.id!=id);S.classes=S.classes.filter(x=>x.sid!=id);S.tasks=S.tasks.filter(x=>x.sid!=id);save();R();toast('Materia eliminada')});
// ---- Tareas ----
function taskRow(t){const p=prio(t),s=sub(t.sid)||{},late=t.status!='completada'&&new Date(t.due)<new Date();
return`<div class="card ${t.status=='completada'?'done':''}" style="margin-bottom:8px"><div class=tk><input type=checkbox ${t.status=='completada'?'checked':''} onchange="tg('${t.id}')" aria-label="Completar"><div class=sp><div class=tt><span class=b>${esc(t.title)}</span></div>
<div class=mut>${esc(s.name||L('Sin materia'))} · ${late?'<span style="color:var(--bad)">'+L('vencida')+'</span> · ':''}${fd(t.due)} · ${t.est||0} h · ${L(t.status)}</div><div>${tagp(p)}${p.why.map(w=>`<span class=tag>${w}</span>`).join('')}</div>${t.desc?`<div class=mut style="margin-top:4px">${esc(t.desc)}</div>`:''}</div>
<div class=row style="flex:none"><button class="btn2 sm" onclick="taskForm('${t.id}')">Editar</button><button class="btn2 sm" onclick="taskDel('${t.id}')">Eliminar</button></div></div>
${t.subs.length?`<div class=sub>${t.subs.map((x,i)=>`<label><input type=checkbox ${x.d?'checked':''} onchange="ts('${t.id}',${i})">${esc(x.t)}</label>`).join('')}</div>`:''}${t.notes?`<div class=mut style="margin:6px 0 0 30px">${L('Nota:')} ${esc(t.notes)}</div>`:''}</div>`}
function tlist(){let a=S.tasks.filter(t=>(!tf.q||(t.title+t.desc).toLowerCase().includes(tf.q.toLowerCase()))&&(!tf.st||t.status==tf.st)&&(!tf.sid||t.sid==tf.sid));
const sorts={prio:(x,y)=>prio(y).lv-prio(x).lv||new Date(x.due)-new Date(y.due),due:(x,y)=>new Date(x.due)-new Date(y.due),urg:(x,y)=>y.urg-x.urg,imp:(x,y)=>y.imp-x.imp,sid:(x,y)=>(sub(x.sid)?.name||'').localeCompare(sub(y.sid)?.name||''),st:(x,y)=>x.status.localeCompare(y.status)};
return a.sort(sorts[tf.sort]).map(taskRow).join('')||`<div class=card><span class=mut>${S.tasks.length?'Ningún resultado con estos filtros.':'Aún no tienes tareas. Crea la primera con «Nueva tarea».'}</span></div>`}
const tl=()=>{$('#tl').innerHTML=tlist()};
const tareas=()=>`<div class=hd><h2 class=sp>Tareas</h2><button class=btn onclick="taskForm()">Nueva tarea</button></div><div class=filt><input placeholder="Buscar…" value="${esc(tf.q)}" oninput="tf.q=this.value;tl()"><select onchange="tf.st=this.value;tl()"><option value="">Estado: todos</option>${opts([['pendiente','Pendiente'],['en progreso','En progreso'],['completada','Completada']],tf.st)}</select><select onchange="tf.sid=this.value;tl()"><option value="">Materia: todas</option>${opts(S.subjects.map(s=>[s.id,s.name]),tf.sid)}</select><select onchange="tf.sort=this.value;tl()">${opts([['prio','Orden: prioridad'],['due','Fecha de entrega'],['urg','Urgencia'],['imp','Importancia'],['sid','Materia'],['st','Estado']],tf.sort)}</select></div><div id=tl>${tlist()}</div>`;
function taskForm(id){if(!S.subjects.length){toast('Primero crea una materia');return subForm()}const t=S.tasks.find(x=>x.id==id)||{},L=[[1,'Baja'],[2,'Media'],[3,'Alta']],d=new Date(Date.now()+864e5);d.setHours(23,59);
dlg(id?'Editar tarea':'Nueva tarea',`<label>Título<input name=title required value="${esc(t.title||'')}"></label><label>Descripción<textarea name=desc rows=2>${esc(t.desc||'')}</textarea></label>
<div class=two><label>Materia<select name=sid>${opts(S.subjects.map(s=>[s.id,s.name]),t.sid)}</select></label><label>Entrega<input type=datetime-local name=due required value="${t.due||iso(d)+'T23:59'}"></label></div>
<div class=two><label>Urgencia<select name=urg>${opts(L,t.urg||2)}</select></label><label>Importancia<select name=imp>${opts(L,t.imp||2)}</select></label></div>
<div class=two><label>Tiempo estimado (horas)<input type=number name=est min=0 max=100 step=.5 value="${t.est??1}"></label><label>Estado<select name=st>${opts([['pendiente','Pendiente'],['en progreso','En progreso'],['completada','Completada']],t.status||'pendiente')}</select></label></div>
<label>Subtareas (una por línea)<textarea name=subs rows=3>${esc((t.subs||[]).map(x=>x.t).join('\n'))}</textarea></label><label>Notas personales<input name=notes value="${esc(t.notes||'')}"></label>`,f=>{
const title=f.get('title').trim();if(!title||!f.get('due'))return false;const old=t.subs||[],subs=f.get('subs').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>({t:x,d:!!old.find(o=>o.t==x&&o.d)})),st=f.get('st');
const o={title,desc:f.get('desc').trim(),sid:f.get('sid'),due:f.get('due'),urg:+f.get('urg'),imp:+f.get('imp'),est:+f.get('est')||0,status:st,subs,notes:f.get('notes').trim(),doneAt:st=='completada'?(t.doneAt||Date.now()):null};
if(t.id)Object.assign(t,o);else S.tasks.push({id:uid(),...o});save();R();toast('Tarea guardada')})}
const tg=id=>{const t=S.tasks.find(x=>x.id==id);if(t.status=='completada'){t.status='pendiente';t.doneAt=null}else{t.status='completada';t.doneAt=Date.now()}save();R();toast(t.status=='completada'?'Tarea completada':'Tarea reabierta')};
const ts=(id,i)=>{const t=S.tasks.find(x=>x.id==id);t.subs[i].d=!t.subs[i].d;save();R()};
const taskDel=id=>ask('¿Eliminar esta tarea?',()=>{S.tasks=S.tasks.filter(x=>x.id!=id);S.events=S.events.filter(e=>e.tid!=id);save();R();toast('Tarea eliminada')});
// ---- Calendario ----
function dayItems(ds){const dy=new Date(ds+'T00:00').getDay(),a=[];S.classes.filter(c=>c.day==dy).forEach(c=>a.push({k:'c',t:c.start,x:`${c.start}–${c.end} ${L('Clase:')} ${esc(sub(c.sid)?.name)}`}));
S.tasks.filter(t=>t.due.slice(0,10)==ds).forEach(t=>a.push({k:t.status!='completada'&&new Date(t.due)<new Date()?'a':'t',t:t.due.slice(11),x:`${t.due.slice(11)} ${L('Entrega:')} ${esc(t.title)} <span class=mut>(${L(t.status)})</span>`}));
S.events.filter(e=>e.date==ds).forEach(e=>a.push({k:'e',t:e.start||'00:00',x:`${e.start?e.start+(e.end?'–'+e.end:'')+' ':''}${L(e.type[0].toUpperCase()+e.type.slice(1))}: ${esc(e.title)} <button class="btn2 sm" onclick="evForm('${e.id}')">Editar</button> <button class="btn2 sm" onclick="evDel('${e.id}')">Eliminar</button>`}));return a.sort((x,y)=>x.t.localeCompare(y.t))}
function calendario(){const y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1),off=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate();let c='';(ui.lang=='en'?['M','T','W','T','F','S','S']:['L','M','X','J','V','S','D']).forEach(d=>c+=`<div class=h>${d}</div>`);
for(let i=0;i<off;i++)c+='<div class=o></div>';for(let d=1;d<=n;d++){const ds=iso(new Date(y,m,d)),it=dayItems(ds).filter(i=>i.k!='c'),cl=new Date(y,m,d).getDay()!=0&&S.classes.some(x=>x.day==new Date(y,m,d).getDay());
c+=`<div class="${ds==iso(new Date())?'t':''} ${ds==calSel?'s':''}" onclick="calSel='${ds}';R()">${d}<br>${cl?'<span class="dot c"></span>':''}${it.slice(0,4).map(i=>`<span class="dot ${i.k=='a'?'a':''}"></span>`).join('')}</div>`}
return`<div class=hd><h2 class=sp>${first.toLocaleDateString(LOC(),{month:'long',year:'numeric'})}</h2><button class=btn2 onclick="calM=new Date(calM.getFullYear(),calM.getMonth()-1,1);R()">‹</button><button class=btn2 onclick="calM=new Date();calSel=iso(calM);R()">Hoy</button><button class=btn2 onclick="calM=new Date(calM.getFullYear(),calM.getMonth()+1,1);R()">›</button></div><div class=cal>${c}</div>
<div class=card style="margin-top:14px"><div class=hd style="margin-bottom:6px"><h3 class=sp style="text-transform:capitalize">${fday(calSel)}</h3><button class="btn sm" onclick="evForm()">Nuevo evento</button></div>${dayItems(calSel).map(i=>`<div style="padding:4px 0">${i.x}</div>`).join('')||'<span class=mut>Sin eventos este día.</span>'}</div><p class=mut>● clases · ● entregas (rojo: vencidas) · ● eventos. Las entregas se toman de tus tareas, sin duplicarlas.</p>`}
function evForm(id){const e=S.events.find(x=>x.id==id)||{};dlg(id?'Editar evento':'Nuevo evento',`<label>Título<input name=title required value="${esc(e.title||'')}"></label><div class=two><label>Tipo<select name=type>${opts([['examen','Examen'],['presentación','Presentación'],['estudio','Bloque de estudio'],['personal','Evento personal']],e.type||'examen')}</select></label><label>Fecha<input type=date name=date required value="${e.date||calSel}"></label></div><div class=two><label>Inicio (opcional)<input type=time name=start value="${e.start||''}"></label><label>Fin (opcional)<input type=time name=end value="${e.end||''}"></label></div>`,f=>{
const s=f.get('start'),en=f.get('end');if(s&&en&&tm(en)<=tm(s)){toast('La hora de fin debe ser posterior a la de inicio');return false}const o={title:f.get('title').trim(),type:f.get('type'),date:f.get('date'),start:s,end:en};if(!o.title)return false;
if(e.id)Object.assign(e,o);else S.events.push({id:uid(),...o});calSel=o.date;save();R();toast('Evento guardado')})}
const evDel=id=>ask('¿Eliminar este evento?',()=>{S.events=S.events.filter(x=>x.id!=id);save();R();toast('Evento eliminado')});
// ---- Estadísticas ----
function stats(){const T=S.tasks,dn=T.filter(t=>t.status=='completada').length,ov=T.filter(t=>t.status!='completada'&&new Date(t.due)<new Date()).length,pn=T.length-dn,pc=T.length?Math.round(dn/T.length*100):0;
const mon=new Date();mon.setHours(0,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));const wk=[5,4,3,2,1,0].map(i=>{const a=+mon-i*7*864e5,b=a+7*864e5;return{l:new Date(a).toLocaleDateString(LOC(),{day:'numeric',month:'short'}),n:T.filter(t=>t.doneAt&&t.doneAt>=a&&t.doneAt<b).length}}),mx=Math.max(1,...wk.map(w=>w.n)),ms=Math.max(1,...S.subjects.map(s=>T.filter(t=>t.sid==s.id).length));
if(!T.length)return'<div class=hd><h2>Estadísticas</h2></div><div class=card><span class=mut>Aún no hay tareas. Crea tareas para ver tu seguimiento.</span></div>';
return`<div class=hd><h2>Estadísticas</h2></div><div class=stats><div class=card><b>${dn}</b><span class=mut>completadas</span></div><div class=card><b>${pn}</b><span class=mut>pendientes</span></div><div class=card><b>${ov}</b><span class=mut>vencidas</span></div><div class=card><b>${pc}%</b><span class=mut>cumplimiento</span></div></div>
<div class=card><h3 style="margin-bottom:10px">Tareas por materia</h3>${S.subjects.map(s=>{const n=T.filter(t=>t.sid==s.id).length;return n?`<div style="margin-bottom:8px"><div class=row><span class=sp>${esc(s.name)}</span><span class=mut>${n}</span></div><div class=bar><i style="width:${n/ms*100}%;background:${col(s.id)}"></i></div></div>`:''}).join('')}</div>
<div class=card><h3 style="margin-bottom:10px">Completadas por semana</h3>${wk.map(w=>`<div class=row style="margin-bottom:6px"><span class=mut style="width:60px">${w.l}</span><div class=bar style="flex:1"><i style="width:${w.n/mx*100}%"></i></div><span style="width:20px;text-align:right">${w.n}</span></div>`).join('')}</div>${S.profile.demo?'<p class=mut>Datos de demostración.</p>':''}`}
// ---- Perfil ----
function perfil(){const p=S.profile;return`<div class=hd><h2>Perfil y ajustes</h2></div><div class=card><div class=b>${esc(p.name)}</div><div class=mut>${esc(p.email||'Invitado')}${p.age?' · '+esc(p.age)+' '+L('años'):''}</div><div class=mut>${esc(p.program||'')} · ${L('semestre')} ${p.sem||'–'} · ${L('periodo')} ${esc(p.period||'')}</div>${p.demo?'':'<div class=row style="margin-top:12px"><button class="btn2 sm" onclick="S.profile.onboarded=false;step=0;R()">Editar perfil y programa</button></div>'}</div>
<div class=card><label>Idioma<select onchange="setLang(this.value)">${opts([['es','Español'],['en','English']],ui.lang)}</select></label><label style="margin:0">Tema<select onchange="setTheme(this.value)">${opts([['auto','Automático'],['light','Claro'],['dark','Oscuro']],ui.theme)}</select></label></div>
<div class=card><h3 style="margin-bottom:8px">Datos locales</h3><p class=mut style="margin-top:0">Se guardan solo en este navegador y no se sincronizan entre dispositivos. Acceso de demostración: no se verificó tu identidad ni son datos protegidos de una cuenta real.</p><div class=row>
${p.demo?`<button class=btn2 onclick="ask('Se restaurarán los datos de ejemplo originales.',()=>{S=seed();save();R();toast('Demo reiniciada')})">Reiniciar demo</button>`:''}<button class=btn2 onclick="ask('Se borrarán todos los datos guardados${p.demo?' de la demo':' de este perfil'}. No se puede deshacer.',wipe)">Borrar datos guardados</button><button class=btn2 onclick="logout()">Cerrar sesión</button></div></div>`}
function wipe(){ls.del(key());logout();toast('Datos borrados')}
if(sess){try{load()}catch(e){sess=null}}R();
</script></body></html>
